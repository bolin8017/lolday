[project]
name = "lolday-backend"
version = "0.1.0"
description = "Lolday platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.47.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30.0",
    "alembic>=1.18.5",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=7.4.0",
    "kubernetes>=31.0.0",
    "maldet>=2.2.1,<3",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "mlflow-skinny>=3.14.0",
    "prometheus-fastapi-instrumentator~=7.0",
    "cachetools>=7.1.4",
    "psycopg2-binary>=2.9.12",
    "jsonschema>=4.20,<5",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.21.0",
    "respx>=0.21.0",
    "fakeredis>=2.36.2",
    "mypy>=2.1.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6,<4",
    "pytest-timeout>=2.3,<3",
    "pytest-randomly>=4.1.0,<5",
    "pytest-rerunfailures>=16.3,<17",
    "pytest-split>=0.9,<1",
    "pytest-testmon>=2.1,<3",  # dev-only; CI does not invoke testmon mode
    "freezegun>=1.5,<2",
    "hypothesis>=6.155.7,<7",
    "schemathesis>=4.21.10,<5",
    "testcontainers[postgres,minio]>=4.14.2,<5",
    "mlflow>=2.20,<4",  # for testcontainers real-MLflow tier; <4 to match mlflow-skinny 3.x resolution (cachetools<6 in mlflow 2.x conflicts with project cachetools>=7)
    "polyfactory>=3.3.0,<4",
    "mutmut>=3.6.0,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto --dist loadscope --maxfail=10 --durations=20 --strict-markers --timeout=30"
markers = [
    "no_mock_mlflow: do not apply the MLflow autouse mock",
    "heavy: testcontainers slow tier; skipped by default in fast tier (-m 'not heavy')",
    "contract: API or manifest contract test (runs serial)",
    "flaky_tracked: known flaky test; must carry issue=<github-url> kwarg",
]

[tool.coverage.run]
# Enable branch coverage. Without it, coverage.py's line-only tracer
# under-reports multi-line `await session.execute(select(...).join(...))`
# statements as fully missed even when the function executes — most
# visible on router modules with heavy SQLAlchemy chained calls
# (`app/routers/models_registry.py` reported 39% line-only vs 49% with
# branch coverage on identical test runs). Branch coverage also tracks
# branch outcomes, which mainstream Python projects (Django / FastAPI /
# SQLAlchemy itself) enable by default. See PR description for the
# coverage diff that motivated this change.
#
# Known artifact (2026-05-20, do not chase numbers blindly):
# `branch = true` forces the CTracer (sys.settrace) collector because
# the sys.monitoring core (PEP 669) does not yet support branch coverage
# on Python 3.12.x — see https://coverage.readthedocs.io/en/7.13.5/messages.html#warning-no-sysmon
# CTracer significantly under-reports async-coroutine bodies because
# settrace does not reliably re-attach on event-loop coroutine resume.
# Measured on `app/routers/models_registry.py` against the same 50-test
# subset (`tests/integration/services/test_models_*.py`):
#     CTracer + branch=true  →  42%  (94/184 statements reported missed)
#     sysmon  + branch=false →  95%  (10/184 statements reported missed)
# The 53-percentage-point delta is tooling noise, not real test gaps;
# the 50 tests pass under both engines and cover the same source paths.
# Before chasing a low coverage number on a router module, re-run with
# `COVERAGE_CORE=sysmon --cov-config=...` (branch off) and use the
# delta to separate real gaps from this artifact. Status quo keeps
# branch coverage because the if-arm coverage signal on sync helper
# code (`_summary_query_for_rm`, `_model_version_to_read`, etc.) is
# more valuable than the async-route headline number — once Python
# 3.14 ships sys.monitoring branch support, switch this off.
branch = true

[tool.mutmut]
# Phase 4 D4.3 — weekly mutation tier. Targets the top-10 high-risk
# modules per spec §1.2 (ranked by 30-day churn × fan-in × postmortem
# involvement). Phase 4 exit gate: ≥60% killed per module; final
# target (Phase 4 spec §7.4): ≥80%.
paths_to_mutate = [
    "app/routers/jobs.py",
    "app/reconciler/jobs.py",
    "app/services/mlflow_client.py",
    "app/reconciler/fifo_scheduler.py",
    "app/services/build.py",
    "app/routers/experiments_proxy.py",
    "app/auth/cf_access.py",
    "app/models/job.py",
    "app/services/gpu_signal.py",
    "app/reconciler/build_finalize.py",
]
tests_dir = ["tests/"]
# Skip heavy testcontainers tests during mutation runs (would take
# hours per module). Also disable xdist (mutmut runs its own workers)
# and rerunfailures (a failed-on-mutant rerun adds latency without
# improving the kill signal).
pytest_add_cli_args = ["-m", "not heavy", "-p", "no:xdist", "-p", "no:rerunfailures"]
