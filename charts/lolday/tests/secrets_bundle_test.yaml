suite: Operator-supplied Secrets (fernet / harbor-admin / cloudflared / mlflow-db / minio-root / grafana-admin)
templates:
  - templates/backend-fernet-secret.yaml
  - templates/harbor-admin-secret.yaml
  - templates/cloudflared-secret.yaml
  - templates/mlflow-secret.yaml
  - templates/minio-root-cred-secret.yaml
  - templates/monitoring/grafana-admin-secret.yaml
values:
  - ../values-test.yaml
release:
  name: lolday
  namespace: lolday
chart:
  version: 0.0.0
  appVersion: test
tests:
  # ---- backend-fernet-secret.yaml ----
  - it: backend-fernet-key Secret renders with the singular `key` data field
    # Reason: P3 H-18b kept the data key `key` (singular) even after the
    # field accepted a whitespace-separated LIST of base64 Fernet keys.
    # backend/app/config.py and the dependent rotation runbook
    # (docs/runbooks/p3-fernet-rotation.md) expect `data.key`; renaming to
    # `data.keys` would break boot and the rotation runbook silently.
    template: templates/backend-fernet-secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: backend-fernet-key
      - equal:
          path: metadata.namespace
          value: lolday
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.key
          value: fake-fernet-key-for-test-only

  - it: backend-fernet-key is gated off when backend.enabled=false
    template: templates/backend-fernet-secret.yaml
    set:
      backend.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: backend-fernet-key required() fires when fernetKeys is empty
    # Reason: empty fernet key set on boot reads `Settings.fernet_keys = []`
    # and crashes the AES rotation path. Helm-time required() is the only
    # gate before pods boot — if it stops firing, the misconfig sneaks
    # through to runtime crash. helm-unittest renders required() as a
    # template error caught by `failedTemplate`.
    template: templates/backend-fernet-secret.yaml
    set:
      backend.fernetKeys: ""
    asserts:
      - failedTemplate:
          errorMessage: "backend.fernetKeys is required (whitespace-separated list of base64 Fernet keys)"

  # ---- harbor-admin-secret.yaml ----
  - it: backend-harbor-admin Secret renders with the password key
    template: templates/harbor-admin-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: backend-harbor-admin
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.password
          value: fake-harbor-admin-pw

  - it: backend-harbor-admin required() fires when password is empty
    template: templates/harbor-admin-secret.yaml
    set:
      backend.harborAdminPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: "backend.harborAdminPassword is required"

  # ---- cloudflared-secret.yaml ----
  - it: cloudflared-tunnel-token Secret renders with the tunnel-token key
    template: templates/cloudflared-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: cloudflared-tunnel-token
      - equal:
          path: stringData["tunnel-token"]
          value: fake-cf-tunnel-token

  - it: cloudflared-tunnel-token is gated off when cloudflare.enabled=false
    template: templates/cloudflared-secret.yaml
    set:
      cloudflare.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: cloudflared-tunnel-token required() fires when tunnelToken is empty
    template: templates/cloudflared-secret.yaml
    set:
      cloudflare.tunnelToken: ""
    asserts:
      - failedTemplate:
          errorMessage: "cloudflare.tunnelToken must be set when cloudflare.enabled=true (pass via --set cloudflare.tunnelToken=$CF_TUNNEL_TOKEN)"

  # ---- mlflow-secret.yaml ----
  - it: mlflow-db Secret renders all three keys when mlflow.enabled=true
    template: templates/mlflow-secret.yaml
    set:
      mlflow.enabled: true
      mlflow.db.username: "mlflow"
      mlflow.db.password: "fake-mlflow-pw"
      mlflow.db.database: "mlflow"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: mlflow-db
      - equal:
          path: stringData.username
          value: mlflow
      - equal:
          path: stringData.password
          value: fake-mlflow-pw
      - equal:
          path: stringData.database
          value: mlflow

  - it: mlflow-db is gated off when mlflow.enabled=false (default in values-test)
    template: templates/mlflow-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mlflow-db required() fires when password is empty
    template: templates/mlflow-secret.yaml
    set:
      mlflow.enabled: true
      mlflow.db.password: ""
    asserts:
      - failedTemplate:
          errorMessage: "mlflow.db.password must be set via --set"

  # ---- minio-root-cred-secret.yaml ----
  - it: minio-root-cred Secret renders with rootUser=minio-admin + random 32-char password
    # Reason: the `lookup` call in helm-template (no real cluster) returns
    # nil, so the fresh-install path runs and `randAlphaNum 32` produces a
    # new value each render. Pin SHAPE (`rootUser` literal, password is
    # 32 alphanumeric chars) rather than VALUE (would be flaky). The
    # `lookup`-keeps-existing semantic is exercised in deploy-time
    # integration, not here.
    template: templates/minio-root-cred-secret.yaml
    set:
      minio.enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: minio-root-cred
      - equal:
          path: stringData.rootUser
          value: minio-admin
      - matchRegex:
          path: stringData.rootPassword
          pattern: "^[A-Za-z0-9]{32}$"

  - it: minio-root-cred is gated off when minio.enabled=false (default in values-test)
    template: templates/minio-root-cred-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ---- monitoring/grafana-admin-secret.yaml ----
  - it: grafana-admin Secret lives in the RELEASE namespace (not the monitoring ns)
    # Reason: kps's Grafana sub-chart deploys to .Release.Namespace, not
    # `monitoring`. The existingSecret lookup matches by Release ns. A
    # regression that targets the monitoring ns would split admin login
    # from the Grafana pod's read path. Pin the ns binding to .Release.
    template: templates/monitoring/grafana-admin-secret.yaml
    set:
      monitoring.enabled: true
      monitoring.grafana.adminPassword: "fake-grafana-pw"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: grafana-admin
      - equal:
          path: metadata.namespace
          value: lolday
      - equal:
          path: stringData["admin-user"]
          value: admin
      - equal:
          path: stringData["admin-password"]
          value: fake-grafana-pw

  - it: grafana-admin is gated off when monitoring.enabled=false (default)
    template: templates/monitoring/grafana-admin-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: grafana-admin required() fires when adminPassword is empty
    template: templates/monitoring/grafana-admin-secret.yaml
    set:
      monitoring.enabled: true
      monitoring.grafana.adminPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: "monitoring.grafana.adminPassword must be set (via --set or values)"
