suite: Kyverno ClusterPolicies
templates:
  - templates/policies/verify-images.yaml
  - templates/policies/verify-images-harbor.yaml
  - templates/policies/pss-baseline-audit.yaml
values:
  - ../values-test.yaml
set:
  # All three ClusterPolicy templates are gated on kyverno.enabled.
  # Enable it so the suite can render and assert on them.
  kyverno.enabled: true
release:
  name: lolday
  namespace: lolday
chart:
  version: 0.0.0
  appVersion: test
tests:
  # GHCR policy must be Enforce: keyless GHA-signed images are only
  # trusted if admission blocks unsigned pulls immediately.
  - it: GHCR ClusterPolicy (verify-lolday-image-signatures) is in Enforce mode
    template: templates/policies/verify-images.yaml
    asserts:
      - isKind:
          of: ClusterPolicy
      - equal:
          path: metadata.name
          value: verify-lolday-image-signatures
      - equal:
          path: spec.validationFailureAction
          value: Enforce

  # Harbor policy ships in Audit mode by default (spec 2026-05-12 §4,
  # chart 0.24.0): operator promotes to Enforce via the chart values flag
  # `kyverno.harborImageSignatureEnforce: true` after the 7d audit window.
  # This test pins the shipped default so a stray PR cannot silently
  # promote it to Enforce (which would block all Harbor image pulls before
  # the cosign public-key Secret is distributed to every node).
  - it: Harbor ClusterPolicy (verify-lolday-harbor-image-signatures) ships in Audit mode
    template: templates/policies/verify-images-harbor.yaml
    asserts:
      - isKind:
          of: ClusterPolicy
      - equal:
          path: metadata.name
          value: verify-lolday-harbor-image-signatures
      - equal:
          path: spec.validationFailureAction
          value: Audit

  # Sister check: when the chart values flag flips to true, the same
  # template renders Enforce. Guards both the Sprig conditional in
  # `templates/policies/verify-images-harbor.yaml` and the absence of
  # any stray `Audit`-pinning override elsewhere in the chart.
  # Reason: helm-unittest `set:` here narrowly targets the flag without
  # disturbing the file-level `kyverno.enabled: true` value.
  - it: Harbor ClusterPolicy promotes to Enforce when harborImageSignatureEnforce is true
    template: templates/policies/verify-images-harbor.yaml
    set:
      kyverno.harborImageSignatureEnforce: true
    asserts:
      - isKind:
          of: ClusterPolicy
      - equal:
          path: metadata.name
          value: verify-lolday-harbor-image-signatures
      - equal:
          path: spec.validationFailureAction
          value: Enforce

  # PSS baseline audit policy must also remain in Audit — the enforcement
  # is done by the built-in Pod Security Admission labels on each namespace.
  # Double-enforce via Kyverno Enforce would block admission even on
  # intentional exceptions (e.g. the seccomp installer in lolday-builds).
  - it: PSS baseline ClusterPolicy stays in Audit mode
    template: templates/policies/pss-baseline-audit.yaml
    asserts:
      - isKind:
          of: ClusterPolicy
      - equal:
          path: spec.validationFailureAction
          value: Audit

  # ---- deeper GHCR ClusterPolicy invariants (security regression guards) ----
  - it: GHCR ClusterPolicy ships failurePolicy=Fail and webhook timeout 30s
    # Reason: failurePolicy=Fail is the load-bearing security gate — if the
    # Kyverno webhook is unreachable, K8s admission DENIES the pod. Flipping
    # to Ignore would silently let unsigned images through whenever Kyverno
    # itself is unhealthy. webhookTimeoutSeconds=30 gives keyless verify
    # (network round-trips to Fulcio + Rekor) time to complete; a shorter
    # timeout would convert slow-but-valid signatures into admission denials.
    template: templates/policies/verify-images.yaml
    asserts:
      - equal:
          path: spec.failurePolicy
          value: Fail
      - equal:
          path: spec.webhookTimeoutSeconds
          value: 30

  - it: GHCR ClusterPolicy disables background scan and matches lolday + lolday-jobs
    # Reason: background=false because keyless verify needs egress to
    # Fulcio + Rekor on every pass; running it as a 1h background scan on
    # every Pod is expensive and pointless (admission-time gate is the
    # mainstream choice). The Pod-kind match must cover both lolday and
    # lolday-jobs — dropping lolday-jobs would let unsigned detector
    # vcjobs bypass the gate.
    template: templates/policies/verify-images.yaml
    asserts:
      - equal:
          path: spec.background
          value: false
      - contains:
          path: spec.rules[0].match.any[0].resources.namespaces
          content: lolday
      - contains:
          path: spec.rules[0].match.any[0].resources.namespaces
          content: lolday-jobs
      - equal:
          path: spec.rules[0].match.any[0].resources.kinds
          value: [Pod]

  - it: GHCR ClusterPolicy verifies every ghcr.io/bolin8017/lolday-* image with required=true
    # Reason: imageReferences glob `ghcr.io/bolin8017/lolday-*` covers
    # every lolday GHCR image (backend, frontend, plus the two helpers
    # build-helper / job-helper). required=true means the signature MUST
    # be present — flipping to false would silently accept unsigned
    # images whose cosign verify check happens to error out (network
    # blip, Rekor timeout).
    template: templates/policies/verify-images.yaml
    asserts:
      - equal:
          path: spec.rules[0].verifyImages[0].imageReferences
          value: ["ghcr.io/bolin8017/lolday-*"]
      - equal:
          path: spec.rules[0].verifyImages[0].required
          value: true

  - it: GHCR ClusterPolicy pins mutateDigest=false and verifyDigest=true
    # Reason: mutateDigest=false is the "fail loud, never silently fix"
    # contract: when someone forgets to pin an image by digest, Kyverno
    # REJECTS it instead of silently rewriting the ref to the latest
    # digest (which would defeat H-21-img's @sha256 pinning policy).
    # verifyDigest=true ensures the in-cluster manifest digest matches
    # what cosign signed — end-to-end content integrity. A regression
    # that flips either field to the opposite value breaks the supply
    # chain invariant and would not be caught by a casual reviewer.
    template: templates/policies/verify-images.yaml
    asserts:
      - equal:
          path: spec.rules[0].verifyImages[0].mutateDigest
          value: false
      - equal:
          path: spec.rules[0].verifyImages[0].verifyDigest
          value: true

  - it: GHCR ClusterPolicy attestors require count=1 across 4 GHA-OIDC entries (images + helpers, main + tag)
    # Reason: Four keyless entries under one attestors[0] with count: 1 form
    # a logical OR — any one matching is sufficient. They cover the four
    # GHA workflow identities that publish lolday-* images:
    #   1. images.yml @ refs/heads/main
    #   2. images.yml @ refs/tags/v*
    #   3. helpers.yml @ refs/heads/main
    #   4. helpers.yml @ refs/tags/v*
    # A regression that drops one entry (or splits them across multiple
    # attestors stanzas with `count: <N>` constraints) would block legit
    # publishes from that workflow. Pin all four issuer/subject pairs.
    template: templates/policies/verify-images.yaml
    asserts:
      - equal:
          path: spec.rules[0].verifyImages[0].attestors[0].count
          value: 1
      - lengthEqual:
          path: spec.rules[0].verifyImages[0].attestors[0].entries
          count: 4
      - contains:
          path: spec.rules[0].verifyImages[0].attestors[0].entries
          content:
            keyless:
              subject: "https://github.com/bolin8017/lolday/.github/workflows/images.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
              rekor:
                url: "https://rekor.sigstore.dev"
      - contains:
          path: spec.rules[0].verifyImages[0].attestors[0].entries
          content:
            keyless:
              subject: "https://github.com/bolin8017/lolday/.github/workflows/helpers.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
              rekor:
                url: "https://rekor.sigstore.dev"
