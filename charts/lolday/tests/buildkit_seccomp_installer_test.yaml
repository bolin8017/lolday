suite: buildkit-seccomp installer (ConfigMap + DaemonSet)
templates:
  - templates/buildkit-seccomp-installer.yaml
values:
  - ../values-test.yaml
set:
  buildkit.seccompProfile.enabled: true
release:
  name: lolday
  namespace: lolday
chart:
  version: 0.0.0
  appVersion: test
tests:
  - it: renders both the seccomp ConfigMap and the installer DaemonSet
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: ConfigMap
      - documentIndex: 0
        equal:
          path: metadata.name
          value: buildkit-seccomp-profile
      - documentIndex: 1
        isKind:
          of: DaemonSet
      - documentIndex: 1
        equal:
          path: metadata.name
          value: buildkit-seccomp-installer

  - it: is gated off when buildkit.seccompProfile.enabled=false
    set:
      buildkit.seccompProfile.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: lives in the dedicated lolday-builds ns (NOT the infra ns)
    # Reason: H-14 follow-up (#174 / 2026-05-15) — moved out of `lolday`
    # so that promoting the infra ns to PSS enforce=restricted does not
    # need an exemption for the only pod that requires runAsUser=0 +
    # CAP_CHOWN/DAC_OVERRIDE/FOWNER. Moving it back breaks PSS promotion.
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: lolday-builds
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: lolday-builds

  - it: honours global.buildsNamespace override
    set:
      global.buildsNamespace: alt-builds
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: alt-builds
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: alt-builds

  - it: ConfigMap carries the seccomp.json profile body
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["seccomp.json"]
          # The upstream moby default seccomp profile is "defaultAction":
          # "SCMP_ACT_ERRNO" — present in the file we ship.
          pattern: SCMP_ACT_ERRNO

  - it: installer copies the profile to the kubelet seccomp dir
    documentIndex: 1
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "cp /config/seccomp.json /host-seccomp/profiles/buildkit-rootless.json"

  - it: installer runs as root with a narrow capability allowlist
    # Reason: hostPath write to /var/lib/kubelet/seccomp requires UID 0;
    # compensating control is a one-shot file write then `sleep infinity`.
    # Capabilities are restricted to CHOWN/DAC_OVERRIDE/FOWNER — anything
    # broader is a regression.
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value: [CHOWN, DAC_OVERRIDE, FOWNER]

  - it: mounts the host kubelet seccomp dir via hostPath DirectoryOrCreate
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-seccomp
            hostPath:
              path: /var/lib/kubelet/seccomp
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-seccomp
            mountPath: /host-seccomp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: buildkit-seccomp-profile

  - it: caps resources to avoid competing with build workloads
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 16Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 32Mi
