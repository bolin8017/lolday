suite: mlflow-forward-auth Traefik Middleware
templates:
  - templates/mlflow-forward-auth-middleware.yaml
values:
  - ../values-test.yaml
release:
  name: lolday
  namespace: lolday
chart:
  version: 0.0.0
  appVersion: test
tests:
  - it: renders a single Traefik Middleware in global.namespace
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Middleware
      - equal:
          path: apiVersion
          value: traefik.io/v1alpha1
      - equal:
          path: metadata.name
          value: mlflow-forward-auth
      - equal:
          path: metadata.namespace
          value: lolday

  - it: forwardAuth.address points at the in-cluster backend mlflow-authz endpoint
    # Reason: a drifted address (wrong port, wrong path, wrong svc DNS)
    # silently breaks /mlflow/* authn because Traefik treats a 5xx
    # ForwardAuth response as deny.
    asserts:
      - equal:
          path: spec.forwardAuth.address
          value: http://backend.lolday.svc.cluster.local:8000/api/v1/mlflow-authz

  - it: honours global.namespace in the forwardAuth address
    set:
      global.namespace: alt
    asserts:
      - equal:
          path: spec.forwardAuth.address
          value: http://backend.alt.svc.cluster.local:8000/api/v1/mlflow-authz

  - it: propagates browser CF Access JWT + sidecar Authorization headers
    # Reason: H-15 — the middleware must forward both `Cf-Access-Jwt-
    # Assertion` (browser users) and `Authorization` (job pods carrying
    # a bearer token). Dropping either breaks one of the two caller
    # classes silently — browser sessions would 401, sidecar uploads
    # would 401.
    asserts:
      - contains:
          path: spec.forwardAuth.authRequestHeaders
          content: Cf-Access-Jwt-Assertion
      - contains:
          path: spec.forwardAuth.authRequestHeaders
          content: Authorization

  - it: surfaces only the X-Lolday-Authz-As response header (informational)
    # Reason: Traefik ForwardAuth strips backend response headers
    # except for those listed in authResponseHeaders. X-Lolday-Authz-As
    # is the only signal we expose to access logs so the operator can
    # confirm admin/user/job for a given allow. Don't add more headers
    # — Traefik forwards them to the client, which is a leak surface.
    asserts:
      - equal:
          path: spec.forwardAuth.authResponseHeaders
          value: [X-Lolday-Authz-As]
