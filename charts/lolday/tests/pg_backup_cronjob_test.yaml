suite: pg-backup CronJob
templates:
  - templates/monitoring/pg-backup-cronjob.yaml
values:
  - ../values-test.yaml
set:
  postgresql.enabled: true
  pgBackup.enabled: true
release:
  name: lolday
  namespace: lolday
chart:
  version: 0.0.0
  appVersion: test
tests:
  - it: renders the CronJob and its egress NetworkPolicy
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: CronJob
      - documentIndex: 0
        equal:
          path: metadata.name
          value: pg-backup
      - documentIndex: 1
        isKind:
          of: NetworkPolicy
      - documentIndex: 1
        equal:
          path: metadata.name
          value: pg-backup-egress

  - it: is gated off when pgBackup.enabled=false
    set:
      pgBackup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is gated off when postgresql.enabled=false
    set:
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: overrides the upstream go-cron entrypoint with /backup.sh
    # Reason: the upstream prodrigestivill/postgres-backup-local image
    # runs `go-cron -s "$SCHEDULE" ... -i`; with SCHEDULE=@disabled
    # go-cron's main loop never starts (upstream issue #45) so the
    # container never exits and the K8s CronJob keeps firing.
    # Documented in `docs/architecture.md` §10 and auto-memory.
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: ["/backup.sh"]

  - it: passes through the configured schedule
    documentIndex: 0
    set:
      pgBackup.schedule: "15 4 * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "15 4 * * *"

  - it: keeps SCHEDULE=@disabled (go-cron is bypassed)
    documentIndex: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: SCHEDULE
            value: "@disabled"

  - it: concurrency-policy is Forbid and history limits are bounded
    documentIndex: 0
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 7

  - it: pod-level securityContext is PSS-restricted compliant
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: container-level securityContext drops ALL caps and forbids privilege escalation
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: wires Postgres credentials from the postgresql Secret
    documentIndex: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgresql
                key: POSTGRES_USER
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgresql
                key: POSTGRES_PASSWORD

  - it: wires S3 credentials from the pg-backup-s3-cred Secret
    documentIndex: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: pg-backup-s3-cred
                key: access-key
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: pg-backup-s3-cred
                key: secret-key

  - it: points S3 at the in-cluster MinIO service
    documentIndex: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: http://lolday-minio.lolday.svc:9000
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_S3V4
            value: "yes"

  - it: passes pgBackup.s3Bucket and pgBackup.keepDays through
    documentIndex: 0
    set:
      pgBackup.s3Bucket: my-backups
      pgBackup.keepDays: "14"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: S3_BUCKET
            value: my-backups
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_KEEP_DAYS
            value: "14"

  - it: disables ServiceAccount token auto-mount
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: mounts emptyDir volumes for /backups and /tmp under read-only rootfs
    documentIndex: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: backups
            mountPath: /backups
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: backups
            emptyDir: {}
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: NetworkPolicy scopes egress to the pg-backup pod label
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: pg-backup
      - equal:
          path: spec.policyTypes
          value: [Egress]

  - it: NetworkPolicy allows egress to kube-dns, postgresql, and minio only
    documentIndex: 1
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: postgresql
            ports:
              - protocol: TCP
                port: 5432
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app: minio
            ports:
              - protocol: TCP
                port: 9000
